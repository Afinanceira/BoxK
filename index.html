<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Challenge Box K 2026 - Filtro Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&subset=latin,latin-ext&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%; height: 100%; height: 100dvh;
            background: #000; color: #fff;
            font-family: 'Oswald', sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .stage {
            position: relative;
            width: 100vw; height: 100vh; height: 100dvh;
            max-width: 430px; max-height: 900px;
            background: #000; overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stage.active {
            opacity: 1;
        }

        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        #maskScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #172554 0%, #090d16 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .mask-title {
            font-size: 42px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            line-height: 1.1;
            background: linear-gradient(90deg, #F16623 0%, #ff9e44 50%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mask-desc {
            font-family: sans-serif;
            font-size: 14px;
            color: #cbd5e1;
            max-width: 280px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .btn-load-filter {
            background: linear-gradient(135deg, #F16623 0%, #ea580c 50%, #1d4ed8 100%);
            color: #fff;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(241, 102, 35, 0.45);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-load-filter:active {
            transform: scale(0.95);
        }

        /* FUMAÇA ANIMADA NAS LATERAIS - LARANJA E AZUL */
        .smoke-left {
            position: absolute; top: 0; left: -25%;
            width: 65%; height: 100%;
            background: radial-gradient(circle at 10% 50%, rgba(241, 102, 35, 0.55), transparent 75%);
            filter: blur(25px); pointer-events: none; z-index: 2;
            animation: pulseL 3.5s ease-in-out infinite alternate;
        }

        .smoke-right {
            position: absolute; top: 0; right: -25%;
            width: 65%; height: 100%;
            background: radial-gradient(circle at 90% 50%, rgba(29, 91, 179, 0.6), transparent 75%);
            filter: blur(25px); pointer-events: none; z-index: 2;
            animation: pulseR 3.5s ease-in-out infinite alternate;
        }

        @keyframes pulseL { 0% { opacity: 0.45; } 100% { opacity: 0.85; } }
        @keyframes pulseR { 0% { opacity: 0.85; } 100% { opacity: 0.45; } }

        /* MOLDURA / SOBREPOSIÇÃO SEM FUNDO DO CHALLENGE BOX K COM CONTRASTE LIMPO */
        .frame-overlay-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 3;
            filter: drop-shadow(0px 3px 10px rgba(0, 0, 0, 0.78)) drop-shadow(0px 0px 2px rgba(0, 0, 0, 0.9));
        }

        /* CARD DE FRASES INDEPENDENTE NO TOPO (SEM ANCESTRAL COM pointer-events: none) */
        .badge-card {
            position: absolute;
            top: max(54px, env(safe-area-inset-top) + 20px);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 28px);
            max-width: 390px;
            z-index: 999;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 12px;
            border-radius: 18px;
            background: rgba(9, 13, 22, 0.88);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.82);
        }

        .badge-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
        }

        .btn-arrow {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid #ff9d3b;
            background: linear-gradient(135deg, #F16623, #1d4ed8);
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 28px;
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.8);
            touch-action: manipulation;
        }

        .btn-arrow:active {
            transform: scale(0.86);
            filter: brightness(1.25);
        }

        .badge-title-wrap {
            flex: 1;
            min-width: 0;
            cursor: pointer;
            padding: 4px 4px;
            border-radius: 10px;
            touch-action: manipulation;
        }

        .badge-title-wrap:active {
            transform: scale(0.97);
        }

        .badge-title {
            font-size: clamp(28px, 7.2vw, 40px);
            font-weight: 700;
            line-height: 1.02;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #F16623 0%, #ff9d3b 48%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.98));
            display: block;
        }

        .badge-counter {
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fbbf24;
            margin-top: 4px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
        }

        #flashEffect {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 1200; opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease-out;
        }

        #toastMsg {
            position: absolute; top: 175px; left: 50%;
            transform: translateX(-50%) translateY(-25px);
            background: rgba(15, 15, 25, 0.96); color: #fff;
            padding: 16px 24px; border-radius: 20px;
            font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.85); z-index: 1500; opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center;
            gap: 12px; border: 1px solid rgba(255,255,255,0.25); text-align: center;
        }

        #toastMsg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast-actions {
            display: flex; gap: 10px; width: 100%; justify-content: center;
        }

        .btn-share-native {
            background: linear-gradient(135deg, #F16623, #1d4ed8);
            color: #fff; border: none; padding: 8px 16px;
            border-radius: 12px; font-weight: bold; font-size: 12px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.5);
            display: flex; align-items: center; gap: 6px;
        }

        .btn-retake {
            background: rgba(255, 255, 255, 0.15);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px; border-radius: 12px; font-weight: bold; font-size: 12px;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        .controls-bar {
            position: absolute; bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%); width: 65%; max-width: 260px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 15px; background: rgba(12, 12, 18, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 40px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
            z-index: 999;
        }

        .btn-icon {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; touch-action: manipulation;
        }

        .btn-icon svg { width: 20px; height: 20px; fill: #ffffff; }
        .btn-icon:active { transform: scale(0.90); background: rgba(255, 255, 255, 0.22); }

        .btn-shutter {
            background: #ffffff; width: 62px; height: 62px; border-radius: 50%;
            border: 4px solid rgba(241, 102, 35, 0.95); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 0 24px rgba(241, 102, 35, 0.6); touch-action: manipulation;
        }

        .btn-shutter svg { width: 26px; height: 26px; fill: #1d4ed8; }
        .btn-shutter:active { transform: scale(0.92); background: #e2e8f0; }
    </style>
</head>
<body>

    <div id="maskScreen">
        <h1 class="mask-title">CHALLENGE BOX K 2026</h1>
        <p class="mask-desc">Toque no botão abaixo para carregar a versão mais recente do seu filtro oficial.</p>
        <button type="button" class="btn-load-filter" onclick="initializeExperience()">
            <span>⚡</span> Carregar Filtro
        </button>
    </div>

    <div class="stage" id="stageArea">
        <video id="webcam" autoplay playsinline muted></video>

        <div class="smoke-left"></div>
        <div class="smoke-right"></div>

        <img id="frameOverlayImg" class="frame-overlay-img" crossorigin="anonymous" alt="Challenge Box K 2026">

        <div class="badge-card" id="badgeCard">
            <div class="badge-row">
                <button type="button" class="btn-arrow" onclick="prevBadge()" title="Frase anterior" aria-label="Frase anterior">&#8249;</button>
                <div class="badge-title-wrap" onclick="nextBadge()" title="Toque para mudar frase">
                    <span id="badgeTitle" class="badge-title">SOBREVIVI À PROVA</span>
                </div>
                <button type="button" class="btn-arrow" onclick="nextBadge()" title="Próxima frase" aria-label="Próxima frase">&#8250;</button>
            </div>
            <span id="badgeCounter" class="badge-counter">1 / 8 • TOQUE NAS SETAS</span>
        </div>

        <div id="flashEffect"></div>

        <div id="toastMsg">
            <span>🔥 Foto capturada com sucesso!</span>
            <div class="toast-actions">
                <button type="button" class="btn-share-native" id="shareBtn" onclick="sharePhoto()">📤 Partilhar</button>
                <button type="button" class="btn-retake" onclick="retakePhoto()">🔄 Tirar Outra</button>
            </div>
        </div>

        <canvas id="photoCanvas" style="display: none;"></canvas>

        <div class="controls-bar">
            <button type="button" class="btn-icon" onclick="switchCam()" title="Inverter Câmera">
                <svg viewBox="0 0 24 24"><path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </button>

            <button type="button" class="btn-shutter" onclick="takePhoto()" title="Tirar Foto">
                <svg viewBox="0 0 24 24"><path d="M12 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm10-3h-3.17L17 4H7L5.17 6H2v14h20V6zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </button>
        </div>
    </div>

    <script>
        (async function purgeOldCacheOnOpen() {
            const APP_VERSION = '2026.11.26-v26';
            const VERSION_KEY = 'challenge_boxk_app_ver';
            const RELOAD_GUARD_KEY = 'challenge_boxk_reloaded_' + APP_VERSION;

            try {
                const alreadyReloadedThisSession = sessionStorage.getItem(RELOAD_GUARD_KEY) === '1';
                const storedVersion = localStorage.getItem(VERSION_KEY);

                if (!alreadyReloadedThisSession && storedVersion !== APP_VERSION) {
                    sessionStorage.setItem(RELOAD_GUARD_KEY, '1');
                    localStorage.setItem(VERSION_KEY, APP_VERSION);

                    try {
                        Object.keys(sessionStorage).forEach(function(key) {
                            if (key !== RELOAD_GUARD_KEY && key.indexOf('challenge_boxk_') === 0) {
                                sessionStorage.removeItem(key);
                            }
                        });
                    } catch (e) {}

                    if ('caches' in window && typeof caches.keys === 'function') {
                        try {
                            const cacheNames = await caches.keys();
                            await Promise.all(cacheNames.map(function(name) {
                                return caches.delete(name);
                            }));
                        } catch (e) {}
                    }

                    const cleanUrl = window.location.origin + window.location.pathname;
                    window.location.replace(cleanUrl + '?v=' + encodeURIComponent(APP_VERSION) + '&nocache=' + Date.now());
                } else {
                    localStorage.setItem(VERSION_KEY, APP_VERSION);
                }
            } catch (e) {}
        })();

        const badgeList = [
            { title: "SOBREVIVI À PROVA" },
            { title: "MODO K ATIVADO" },
            { title: "NO LIMITE" },
            { title: "VIM PARA TORCER" },
            { title: "EU FUI" },
            { title: "EU TAVA" },
            { title: "TORCIDA OFICIAL" },
            { title: "NA VIBRAÇÃO" }
        ];

        let currentBadgeIndex = 0;
        let currentFacingMode = 'user';
        let currentStream = null;
        let lastGeneratedBlob = null;

        function renderBadge() {
            const total = badgeList.length;
            currentBadgeIndex = ((currentBadgeIndex % total) + total) % total;
            const current = badgeList[currentBadgeIndex];
            const titleEl = document.getElementById('badgeTitle');
            const countEl = document.getElementById('badgeCounter');
            if (titleEl) titleEl.textContent = current.title;
            if (countEl) countEl.textContent = (currentBadgeIndex + 1) + ' / ' + total + ' • TOQUE NAS SETAS';
        }

        function nextBadge() {
            currentBadgeIndex += 1;
            renderBadge();
        }

        function prevBadge() {
            currentBadgeIndex -= 1;
            renderBadge();
        }

        (function enableBadgeSwipe() {
            const card = document.getElementById('badgeCard');
            if (!card) return;
            let startX = null;
            card.addEventListener('touchstart', function(e) {
                if (e.touches && e.touches.length === 1) startX = e.touches[0].clientX;
            }, { passive: true });
            card.addEventListener('touchend', function(e) {
                if (startX === null || !e.changedTouches || !e.changedTouches.length) return;
                const diffX = e.changedTouches[0].clientX - startX;
                startX = null;
                if (Math.abs(diffX) > 35) {
                    if (diffX < 0) nextBadge();
                    else prevBadge();
                }
            }, { passive: true });
        })();

        function initializeExperience() {
            const frameOverlayImg = document.getElementById('frameOverlayImg');
            const maskScreen = document.getElementById('maskScreen');
            const stageArea = document.getElementById('stageArea');
            const cacheBuster = 'v=' + Date.now();

            if (frameOverlayImg) {
                frameOverlayImg.src = "https://i.ibb.co/v465qCDT/ajustado-semfundo.png?" + cacheBuster;
            }

            let revealed = false;
            function revealStage() {
                if (revealed) return;
                revealed = true;
                if (maskScreen) {
                    maskScreen.style.opacity = '0';
                    setTimeout(function() {
                        maskScreen.style.display = 'none';
                        if (stageArea) stageArea.classList.add('active');
                    }, 300);
                } else if (stageArea) {
                    stageArea.classList.add('active');
                }
                startCamera(currentFacingMode);
            }

            if (frameOverlayImg) {
                frameOverlayImg.onload = revealStage;
                frameOverlayImg.onerror = revealStage;
                if (frameOverlayImg.complete && frameOverlayImg.naturalWidth !== 0) {
                    revealStage();
                }
            } else {
                revealStage();
            }
            setTimeout(revealStage, 800);
        }

        async function startCamera(facing) {
            const video = document.getElementById('webcam');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Seu navegador não suporta acesso à câmera neste contexto.");
                return;
            }
            if (currentStream) {
                currentStream.getTracks().forEach(function(track) { track.stop(); });
            }
            const attempts = [
                { video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
                { video: { facingMode: facing, width: { ideal: 1080 }, height: { ideal: 1920 } }, audio: false },
                { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { facingMode: facing }, audio: false },
                { video: true, audio: false }
            ];

            for (let i = 0; i < attempts.length; i++) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia(attempts[i]);
                    if (video) {
                        video.srcObject = currentStream;
                        await video.play().catch(function() {});
                    }
                    return;
                } catch (err) {}
            }
            alert("Permita o acesso à câmera no seu navegador!");
        }

        function switchCam() {
            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
            startCamera(currentFacingMode);
        }

        function triggerFlashAndToast() {
            const flashEffect = document.getElementById('flashEffect');
            const video = document.getElementById('webcam');
            const toastMsg = document.getElementById('toastMsg');
            if (flashEffect) {
                flashEffect.style.opacity = '1';
                setTimeout(function() { flashEffect.style.opacity = '0'; }, 150);
            }
            if (video && typeof video.pause === 'function') video.pause();
            if (toastMsg) toastMsg.classList.add('show');
        }

        function retakePhoto() {
            const toastMsg = document.getElementById('toastMsg');
            const video = document.getElementById('webcam');
            if (toastMsg) toastMsg.classList.remove('show');
            if (video && typeof video.play === 'function') video.play().catch(function() {});
        }

        async function sharePhoto() {
            if (!lastGeneratedBlob) return;
            const file = new File([lastGeneratedBlob], 'challenge-boxk-' + Date.now() + '.jpg', { type: 'image/jpeg' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: 'Challenge Box K 2026',
                        text: 'Meu WOD pago no Challenge Box K 2026! 🔥',
                        files: [file]
                    });
                } catch (err) {}
            } else {
                alert('O seu navegador não suporta partilha direta de ficheiros. Utilize o Safari ou Google Chrome.');
            }
            retakePhoto();
        }

        function takePhoto() {
            triggerFlashAndToast();
            const canvas = document.getElementById('photoCanvas');
            const video = document.getElementById('webcam');
            const frameOverlayImg = document.getElementById('frameOverlayImg');
            if (!canvas || !video || !video.videoWidth || !video.videoHeight) return;

            const ctx = canvas.getContext('2d');
            canvas.width = 1080; canvas.height = 1920;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            const vRatio = video.videoWidth / video.videoHeight;
            const cRatio = canvas.width / canvas.height;
            let sWidth = video.videoWidth, sHeight = video.videoHeight, sx = 0, sy = 0;

            if (vRatio > cRatio) {
                sWidth = video.videoHeight * cRatio; sx = (video.videoWidth - sWidth) / 2;
            } else {
                sHeight = video.videoWidth / cRatio; sy = (video.videoHeight - sHeight) / 2;
            }

            ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);

            const gradLeft = ctx.createRadialGradient(0, canvas.height / 2, 50, 0, canvas.height / 2, canvas.width * 0.5);
            gradLeft.addColorStop(0, 'rgba(241, 102, 35, 0.55)'); gradLeft.addColorStop(1, 'transparent');
            ctx.fillStyle = gradLeft; ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gradRight = ctx.createRadialGradient(canvas.width, canvas.height / 2, 50, canvas.width, canvas.height / 2, canvas.width * 0.5);
            gradRight.addColorStop(0, 'rgba(29, 91, 179, 0.6)'); gradRight.addColorStop(1, 'transparent');
            ctx.fillStyle = gradRight; ctx.fillRect(0, 0, canvas.width, canvas.height);

            const logoSpotGrad = ctx.createRadialGradient(
                canvas.width * 0.82, canvas.height * 0.84, 30,
                canvas.width * 0.82, canvas.height * 0.84, canvas.width * 0.34
            );
            logoSpotGrad.addColorStop(0, 'rgba(0, 0, 0, 0.42)');
            logoSpotGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = logoSpotGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (frameOverlayImg && frameOverlayImg.complete && frameOverlayImg.naturalWidth !== 0) {
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                ctx.shadowBlur = 14;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
                ctx.drawImage(frameOverlayImg, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            ctx.save();
            const current = badgeList[currentBadgeIndex];
            const titleFontSize = 84;
            ctx.font = '700 ' + titleFontSize + 'px "Oswald", sans-serif';
            ctx.textAlign = 'center';

            const textGrad = ctx.createLinearGradient(160, 0, 920, 0);
            textGrad.addColorStop(0, '#F16623');
            textGrad.addColorStop(0.48, '#ff9d3b');
            textGrad.addColorStop(1, '#2563eb');

            ctx.lineJoin = 'round';
            ctx.lineWidth = 7;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.94)';
            ctx.strokeText(current.title, canvas.width / 2, 258);

            ctx.fillStyle = textGrad;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 4;
            ctx.fillText(current.title, canvas.width / 2, 258);
            ctx.restore();

            ctx.shadowColor = 'transparent';
            canvas.toBlob(function(blob) {
                lastGeneratedBlob = blob;
            }, 'image/jpeg', 0.95);
        }

        renderBadge();
    </script>
</body>
</html>
